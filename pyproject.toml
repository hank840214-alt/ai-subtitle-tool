[project]
name = "ai-subtitle-tool"
version = "2.0.0"
description = "AI-powered real-time transcription platform with Traditional Chinese accuracy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "faster-whisper>=1.1.0",
    "opencc-python-reimplemented>=0.1.7",
    "pysrt>=1.1.2",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.18",
    "sse-starlette>=2.0.0",
    "yt-dlp>=2024.1.0",
]
live = [
    "websockets>=12.0",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "httpx>=0.27",
]
qwen3 = [
    "transformers>=4.52",
    "torch>=2.4",
    "soundfile>=0.13",
    "librosa>=0.10",
]
mlx = [
    "mlx-whisper>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
subtitle = "subtitle_tool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["subtitle_tool"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
