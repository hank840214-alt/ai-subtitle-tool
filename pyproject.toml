[project]
name = "ai-subtitle-tool"
version = "0.1.0"
description = "AI-powered subtitle generator with best Traditional Chinese accuracy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "faster-whisper>=1.1.0",
    "opencc-python-reimplemented>=0.1.7",
    "pysrt>=1.1.2",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115.0", "uvicorn>=0.34.0", "python-multipart>=0.0.18"]

[project.scripts]
subtitle = "subtitle_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
